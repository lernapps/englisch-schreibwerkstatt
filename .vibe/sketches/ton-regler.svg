<defs><linearGradient id="g"><stop offset="0" stop-color="#d9822b"/><stop offset=".5" stop-color="#7f8c8d"/><stop offset="1" stop-color="#2c3e75"/></linearGradient></defs>
<rect x="40" y="70" width="400" height="16" rx="8" fill="url(#g)"/><circle cx="240" cy="78" r="16" fill="#fff" stroke="#333" stroke-width="3"/>
