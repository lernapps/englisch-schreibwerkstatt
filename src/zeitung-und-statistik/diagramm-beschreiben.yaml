# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Diagramme beschreiben
description: "Ein Diagramm oder eine Statistik beschreiben und die wichtigste Entwicklung benennen: mit einem Artikel über eine Umfrage und zwei Diagrammen."
competencies: [diagramm-beschreiben]
scope: "Die Seite zeigt, wie man ein Diagramm beschreibt und die wichtigste Entwicklung nennt. Lesestück ist ein erfundener Artikel aus der Stadt Brindley über eine Umfrage mit neunhundert Jugendlichen zur Freizeit (Balkendiagramm, Prozent, Zeilen 3 und 4) und über die Besuche der Stadtbibliothek von 2019 bis 2024 (Liniendiagramm, Zeile 5 und 6). Die Zahlen im Text, in den beiden Diagrammen und in den Aufgaben sind dieselben. Eine Beschreibung hat eine Einleitung (was zeigt das Diagramm), einen Hauptteil mit der wichtigsten Entwicklung und zwei oder drei Zahlen und einen Schluss. Redemittel sind rose by, fell to, rose from … to, the highest, the lowest, more than, fewer than, twice as many as und half as many as; by nennt den Unterschied, to den neuen Wert. Typische Fehler sind Zahlen der Reihe nach vorlesen und increase to statt increase by. Geübt werden ein Diagramm lesen, Aussagen zuordnen, Präpositionen einsetzen, Sätze mit Stichwörtern schreiben, Hören und Nachsprechen und zwei offene Aufgaben. Nicht hier sind Zeitungsaufbau und Information gegen Meinung."
blocks:
  - type: section
    id: einstieg
    title: Worum es geht
    blocks:
      - type: text
        text: "In Zeitungen stehen oft Diagramme (charts) neben dem Text. Du kennst schon Vergleiche und große Zahlen. Danach kannst du ein Diagramm oder eine Statistik beschreiben und die **wichtigste Entwicklung** benennen."
      - type: single-choice
        id: diagramm-start
        text: "Ein Diagramm zeigt, wie viele Leute im Laufe von zwölf Monaten einen Park besucht haben. Was sagst du zuerst?"
        options:
          - text: Alle zwölf Zahlen der Reihe nach
            correct: false
            info: "Wer Zahl für Zahl vorliest, beschreibt nichts. Die Zuhörer müssen selbst herausfinden, was wichtig ist."
          - text: Was das Diagramm zeigt und welche Entwicklung am wichtigsten ist
            correct: true
            info: "Zuerst Thema und wichtigste Entwicklung, danach stützen ein paar Zahlen die Aussage."
          - text: Welche Farbe die Linie hat
            correct: false
            info: "Die Farbe sagt nichts über die Daten. Sie gehört nur zum Aussehen."
        explanation: Eine Beschreibung nennt die wichtigste Entwicklung und stützt sie mit wenigen Zahlen.
  - type: section
    id: lesestueck
    title: Lesestück · Freizeit und Bibliothek in Brindley
    blocks:
      - type: text
        text: "Lies den Artikel in drei Abschnitten. Zu jedem der ersten beiden gehört ein Diagramm. Die Zahlen vor den Zeilen brauchst du bei den Aufgaben. Schwere Wörter stehen hier."
      - type: vocabulary
        caption: Randglossar
        languages: { source: de, target: en }
        entries:
          - target: tick
            source: ankreuzen
          - target: youth council
            source: der Jugendrat
          - target: figure
            source: die Zahl, der Wert
          - target: librarian
            source: die Bibliothekarin, der Bibliothekar
          - target: limit
            source: die Grenze
          - target: for pleasure
            source: zum Vergnügen
          - target: video
            source: das Video
      - type: text
        text: |
          1. **How young people in Brindley spend their free time**
          2. A new survey by Brindley Youth Council asked 900 young people between 13 and 18 how they spend their free time. The survey ran in schools and youth clubs for two weeks, and every young person could tick as many activities as they liked.
          3. Meeting friends came first: 68 per cent said that they meet friends at least once a week. Watching videos was close behind with 61 per cent. Sport followed with 44 per cent, and 36 per cent said that they play computer games (gaming). Reading came last, but still 22 per cent read for pleasure every week.
          4. The youth council says that sport is twice as popular as reading and that fewer than one in four young people read for pleasure every week. In other words, a young person in Brindley is more likely to do sport than to open a book.
      - type: figure
        image: images/diagramm-freizeit.svg
        alt: "Balkendiagramm mit fünf waagerechten Balken. Die Skala unten geht von null bis achtzig Prozent. Neben jedem Balken steht ein Wert."
        caption: "Achte auf die Länge der Balken und auf die Skala unten. Die Balken zeigen, wie viel Prozent der Jugendlichen eine Tätigkeit jede Woche ausüben."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: diagramm-summe
        text: "Die fünf Werte im ersten Diagramm ergeben zusammen mehr als hundert Prozent. Warum (Zeile 2)?"
        options:
          - text: Die Jugendlichen konnten mehrere Tätigkeiten ankreuzen
            correct: true
            info: "In Zeile 2 steht, dass jede Person so viele Tätigkeiten ankreuzen konnte, wie sie wollte. Darum zählt jede Tätigkeit für sich."
          - text: Der Artikel hat sich verrechnet
            correct: false
            info: "Die Zahlen stimmen. Sie beziehen sich bei jeder Tätigkeit auf alle 900 Jugendlichen, nicht aufeinander."
          - text: Manche Jugendliche haben den Fragebogen zweimal ausgefüllt
            correct: false
            info: "Davon steht in Zeile 2 nichts. Jede Person hat einmal geantwortet."
        explanation: Wenn man mehrere Antworten ankreuzen darf, ergeben die Prozente zusammen mehr als hundert.
      - type: text
        text: |
          5. The library counts its visits every year. In 2019 there were 180,000 visits. In 2020 the number fell to 95,000, because the library was closed for several months. Since then it has risen every year and reached 215,000 in 2024, the highest figure in those six years.
          6. The head librarian explains the rise with the new homework club and the longer opening hours. “Visits are now 19 per cent higher than in 2019,” she said. “Libraries still matter to young people.” She adds that the homework club meets twice a week and that the number of young members has grown.
      - type: figure
        image: images/diagramm-bibliothek.svg
        alt: "Liniendiagramm über sechs Jahre. Waagerecht stehen die Jahre, senkrecht die Besuche in Tausend. An jedem Punkt steht ein Wert."
        caption: "Folge der Linie von links nach rechts. Wo steigt sie, wo fällt sie, wo liegt der höchste Punkt?"
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: single-choice
        id: diagramm-zeile
        text: "In welcher Zeile steht, in welchem Jahr die Besuche der Bibliothek am niedrigsten waren?"
        options:
          - text: Zeile 3
            correct: false
            info: "Zeile 3 berichtet über die Umfrage und die Freizeit, nicht über die Bibliothek."
          - text: Zeile 5
            correct: true
            info: "In Zeile 5 steht, dass die Besuche 2020 auf den tiefsten Wert fielen, weil die Bibliothek geschlossen war."
          - text: Zeile 6
            correct: false
            info: "Zeile 6 nennt den Grund für den Anstieg und ein Zitat. Der niedrigste Wert steht dort nicht."
        explanation: Zeile 5 nennt die Jahreszahlen und die Besuche. Der niedrigste Wert stand 2020.
      - type: text
        text: |
          7. Every survey has limits. Only young people who went to a school or a youth club took part, and the survey does not say how much time they spend on each activity. The youth council wants to ask the same questions again in two years. Then it can compare the figures with today’s results.
      - type: open-task
        id: diagramm-meinung
        task: "Welches Ergebnis der Umfrage überrascht dich, und warum? Schreibe zwei bis drei Sätze auf Englisch."
        points:
          - text: Du nennst ein Ergebnis aus dem Artikel, zum Beispiel eine Tätigkeit oder eine Zahl.
            source: /zeitung-und-statistik/diagramm-beschreiben/#lesestueck
          - text: Du gibst einen Grund mit because.
            kind: form
          - text: Du schreibst in ganzen Sätzen.
            kind: form
        solution: |
          I am surprised that gaming is not more popular than sport. I thought that more young people play computer games because it is easy to do at home.
          Die App bewertet deinen Text nicht. Vergleiche ihn mit den Punkten.
  - type: section
    id: bauplan
    title: So beschreibst du ein Diagramm
    blocks:
      - type: text
        text: "Eine Beschreibung hat drei Teile. In der **Einleitung** sagst du, was das Diagramm zeigt: Thema, Zeit und Einheit. Im **Hauptteil** nennst du die wichtigste Entwicklung oder den größten Unterschied und stützt sie mit zwei oder drei Zahlen. Im **Schluss** ziehst du in einem Satz Bilanz. Lies nie alle Zahlen der Reihe nach vor."
      - type: text
        text: |
          Redemittel für den Hauptteil:
          - Entwicklung: **rose**, **fell**, **stayed the same**
          - Der Unterschied: **rose by** …, **fell by** …
          - Der neue Wert: **rose to** …, **fell to** …, **rose from** … **to** …
          - Der höchste und der niedrigste Wert: **the highest**, **the lowest**
          - Vergleich: **more than**, **fewer than**, **twice as many as**, **half as many as**, **twice as popular as**, **half as popular as**
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "**By** nennt den Unterschied, **to** den neuen Wert: The price rose by two pounds, to eight pounds. Nach **twice as many** steht **as**: There are twice as many cars as bikes. Bei Adjektiven ist es genauso: Tea is half as popular as coffee."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: diagramm-lesen
        text: "Welcher Satz beschreibt das Balkendiagramm richtig?"
        material:
          - type: figure
            image: images/diagramm-freizeit.svg
            alt: "Balkendiagramm mit fünf waagerechten Balken. Die Skala unten geht von null bis achtzig Prozent. Neben jedem Balken steht ein Wert."
            caption: "Vergleiche die Länge der Balken."
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Gaming is the fourth most popular activity
            correct: true
            info: "Drei Balken sind länger als der von Gaming, ein Balken ist kürzer."
          - text: Gaming is the most popular activity
            correct: false
            info: "Der längste Balken gehört zu einer anderen Tätigkeit. Gaming liegt im unteren Bereich, an vierter Stelle von fünf."
          - text: Gaming is as popular as sport
            correct: false
            info: "Der Balken von Sport ist länger als der von Gaming, die Werte sind nicht gleich."
          - text: Gaming is less popular than reading
            correct: false
            info: "Der Balken von Reading ist der kürzeste. Gaming ist beliebter als Reading."
        explanation: Gaming steht an vierter Stelle, hinter drei längeren Balken.
      - type: single-choice
        id: diagramm-anfang
        text: "Du sollst das Liniendiagramm beschreiben. Welcher Anfang nennt die Entwicklung?"
        material:
          - type: figure
            image: images/diagramm-bibliothek.svg
            alt: "Liniendiagramm über sechs Jahre. Waagerecht stehen die Jahre, senkrecht die Besuche in Tausend. An jedem Punkt steht ein Wert."
            caption: "Folge der Linie von links nach rechts."
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: In 2019 there were 180,000 visits, in 2020 there were 95,000 visits, in 2021 there were 120,000 visits
            correct: false
            info: "Das liest nur die Zahlen vor. Die Entwicklung, also fallen und danach steigen, steht nicht da."
          - text: Visits fell in 2020 but rose every year after that
            correct: true
            info: "Der Satz nennt die Entwicklung: erst ein Fall, danach jedes Jahr ein Anstieg."
          - text: The chart shows the library
            correct: false
            info: "Das nennt nur das Thema. Eine Beschreibung sagt auch, was sich verändert."
        explanation: Eine gute Beschreibung benennt zuerst die Entwicklung und stützt sie danach mit Zahlen.
      - type: matching
        id: diagramm-zuordnen
        text: "Zu welchem Jahr des Liniendiagramms passt die Aussage?"
        material:
          - type: figure
            image: images/diagramm-bibliothek.svg
            alt: "Liniendiagramm über sechs Jahre. Waagerecht stehen die Jahre, senkrecht die Besuche in Tausend. An jedem Punkt steht ein Wert."
            caption: "Suche die Punkte auf der Linie."
            source: eigene Zeichnung
            licence: CC-BY-4.0
        pairs:
          - { left: "Visits fell to their lowest level.", right: "2020" }
          - { left: "Visits rose for the first time after the fall.", right: "2021" }
          - { left: "There were 180,000 visits.", right: "2019" }
          - { left: "Visits reached the highest level.", right: "2024" }
        distractors: ["2022"]
        explanation: Die Linie fällt 2020 am tiefsten, steigt ab 2021 und erreicht 2024 den höchsten Punkt. 2019 war der Wert 180,000.
      - type: language-task
        id: diagramm-luecke
        languages: { source: de, target: en }
        mode: gap
        form: { case: ok, punctuation: ok }
        task: "Setze by, to oder from ein. Die Zahlen stehen im Liniendiagramm."
        hint: "Sage dir: Nennt die Zahl den Unterschied oder den neuen Wert?"
        material:
          - type: figure
            image: images/diagramm-bibliothek.svg
            alt: "Liniendiagramm über sechs Jahre. Waagerecht stehen die Jahre, senkrecht die Besuche in Tausend. An jedem Punkt steht ein Wert."
            caption: "Die Besuche der Bibliothek in Tausend."
            source: eigene Zeichnung
            licence: CC-BY-4.0
        items:
          - source: "Die Besuche stiegen 2023 um 30,000."
            target: "Visits rose [by] 30,000 in 2023."
            mistakes:
              - answer: "to"
                message: "To nennt den neuen Wert. Hier ist 30,000 der Unterschied zum Jahr davor."
          - source: "Die Besuche fielen 2020 auf 95,000."
            target: "Visits fell [to] 95,000 in 2020."
            mistakes:
              - answer: "by"
                message: "By nennt den Unterschied. Hier ist 95,000 der neue Wert."
          - source: "Die Besuche stiegen von 120,000 auf 160,000."
            target: "Visits rose [from] 120,000 to 160,000 between 2021 and 2022."
            mistakes:
              - answer: "by"
                message: "By nennt den Unterschied. Hier stehen zwei Werte, ein Anfang und ein Ende."
        explanation: By nennt den Unterschied, to den neuen Wert. Mit from … to … nennst du beide Werte.
      - type: language-task
        id: diagramm-beschreibung
        languages: { source: de, target: en }
        form: { case: ok, punctuation: ok }
        task: "Schreibe die Aussage zum Diagramm aus den Stichwörtern."
        hint: "Denke an by und to. Beim Vergleich brauchst du zweimal as."
        items:
          - cue: "visits / fall / by 85,000 / from 2019 to 2020"
            target: "Visits (fell|went down|dropped|decreased) by 85,000 (from 2019 to 2020|between 2019 and 2020|in 2020)."
            mistakes:
              - answer: "Visits fell to 85,000 from 2019 to 2020."
                message: "To nennt den neuen Wert. 85,000 ist aber der Unterschied, den nennst du mit by."
          - cue: "reading / half as popular / sport"
            target: "Reading is half as popular as sport."
            mistakes:
              - answer: "Reading is half popular as sport."
                message: "Bei half as popular as brauchst du zwei as."
          - cue: "visits / rise / to 160,000 / in 2022"
            target: "Visits (rose|went up|increased) to 160,000 in 2022."
            mistakes:
              - answer: "Visits rose by 160,000 in 2022."
                message: "By nennt den Unterschied. 160,000 ist der Wert im Jahr 2022, also der neue Wert."
        explanation: Mit by nennst du den Unterschied, mit to den Wert. Bei Vergleichen mit half oder twice brauchst du zweimal as.
      - type: language-task
        id: diagramm-hoeren
        languages: { source: de, target: en }
        form: { punctuation: ok, case: hint }
        task: "Höre den Satz und schreibe ihn auf."
        items:
          - audio: the-bars-show-the-results-of-the-survey.mp3
            target: The bars show the results of the survey.
          - audio: the-line-drops-at-the-start-and-then-climbs-steadily.mp3
            target: The line drops at the start and then climbs steadily.
          - audio: reading-is-much-less-popular-than-watching-videos.mp3
            target: Reading is much less popular than watching videos.
        explanation: Die Sätze beschreiben, was ein Diagramm zeigt.
  - type: section
    id: anwenden
    title: Selbst schreiben
    blocks:
      - type: speaking-task
        id: diagramm-nachsprechen
        language: en
        task: "Höre die Sätze und sprich sie nach. So beginnst du eine Beschreibung."
        items:
          - audio: let-me-describe-the-chart-in-a-few-sentences.mp3
            text: Let me describe the chart in a few sentences.
          - audio: the-number-fell-in-one-year-and-then-rose-again.mp3
            text: The number fell in one year and then rose again.
          - audio: this-chart-is-easy-to-understand.mp3
            text: This chart is easy to understand.
      - type: figure
        image: images/diagramm-freizeit.svg
        alt: "Balkendiagramm mit fünf waagerechten Balken. Die Skala unten geht von null bis achtzig Prozent. Neben jedem Balken steht ein Wert."
        caption: "Das Balkendiagramm zur Freizeit, für die letzte Aufgabe."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: open-task
        id: diagramm-schreiben
        task: "Beschreibe das Balkendiagramm in vier bis sechs Sätzen auf Englisch."
        points:
          - text: Die Einleitung sagt, was das Diagramm zeigt, mit Thema und Einheit.
            source: /zeitung-und-statistik/diagramm-beschreiben/#bauplan
          - text: Du nennst den größten Unterschied oder die wichtigste Aussage, zum Beispiel den höchsten und den niedrigsten Wert.
            source: /zeitung-und-statistik/diagramm-beschreiben/#bauplan
          - text: Du nennst zwei oder drei Zahlen aus dem Diagramm und vergleichst, zum Beispiel mit more than oder fewer than.
            kind: form
          - text: Du liest nicht alle Zahlen der Reihe nach vor.
            kind: form
        solution: |
          The chart shows how 900 young people in Brindley spend their free time. The most popular activity is meeting friends at 68 per cent, and the least popular is reading with 22 per cent. More young people watch videos than play computer games, and fewer young people play computer games than do sport. In short, young people spend most of their free time with friends.
          Die App bewertet deinen Text nicht. Vergleiche ihn mit den Punkten.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Du kannst jetzt Zeitungen und Statistiken lesen. Probiere es bei der nächsten Nachricht aus: Schau auf den lead, auf Quelle und Datum und auf die Zahlen im Diagramm."
